services:
  dhruv-setu:
    build: .
    container_name: dhruv-setu-crm
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      - dhruv_setu_data:/app/.data

volumes:
  dhruv_setu_data:
